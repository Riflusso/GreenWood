name: Create Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from dynamicmcpack.repo.build
        id: get_version
        run: echo "BUILD_VERSION=$(cat dynamicmcpack.repo.build)" >> $GITHUB_ENV

      - name: Create ZIP archive
        run: |
          cd GreenWood
          zip -r ../GreenWood.zip ./*

      - name: Create CHANGELOG.md for release body
        run: cat CHANGELOG.md > RELEASE_CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.${{ env.BUILD_VERSION }}
          name: Release 0.${{ env.BUILD_VERSION }}
          body_path: RELEASE_CHANGELOG.md
          files: GreenWood.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
